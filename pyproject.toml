[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feedbackloop-harness"
version = "0.1.0"
description = "A deterministic feedback-loop harness for coding agents"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "keyring>=25,<26",
  "pydantic>=2.10,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
feedbackloop-demo = "demo.scenario:main"

[tool.hatch.build.targets.wheel]
packages = ["src/feedbackloop", "demo"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
